[package]
name = "slaunch"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "slaunch"
path = "src/main.rs"

[dependencies]
# Wayland layer shell UI
gtk4 = { version = "0.9", features = ["v4_12"] }
gtk4-layer-shell = "0.4"
async-channel = "2"

# Fuzzy search (SIMD-accelerated, parallel)
nucleo = "0.5"

# Config + serialization
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Async runtime (IPC socket server/client)
tokio = { version = "1", features = ["full"] }

# CLI
clap = { version = "4", features = ["derive"] }

# XDG directories ($XDG_RUNTIME_DIR, $XDG_DATA_DIRS, etc.)
xdg = "2.5"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"

# Math expression evaluator (= prefix mode)
evalexpr = "11"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
